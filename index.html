const KEY='mrmanager_offline_v1';
let db;
try {let v=localStorage.getItem(KEY); db=v?JSON.parse(v):structuredClone(SEED)} catch(e){db=structuredClone(SEED); alert('No se pudo leer el almacenamiento local. Importa una copia para restaurar los datos.');}
let page='dashboard',selectedSession=null,search='',monthCursor='2026-11',sortMode='title',blockFilter='all',sessionShow='all',lastSaveError='',pendingEdits=false,lastSavedAt=null;
const $=x=>document.getElementById(x), safe=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const dateText=d=>{if(!d)return '';let a=d.split('-');return `${a[2]}/${a[1]}/${a[0]}`};
const season=()=>db.seasons.find(x=>x.id===db.active)||db.seasons[0];
const sById=id=>season().sessions.find(s=>s.id===id);
const wById=id=>season().works.find(w=>w.id===id);
const isActive=s=>s.status==='Realizado';
function showSaveStatus(state, message){
 const el=$('saveStatus'), txt=$('saveStatusText');
 if(el && txt){el.className='save-status status-'+state;txt.textContent=message;}
 const foot=$('storageNotice');
 if(foot)foot.textContent=message;
}
function savedClock(){return new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit',second:'2-digit'});}
function markPending(){
 pendingEdits=true;
 showSaveStatus('pending','● Cambios sin guardar · Pulsa «Guardar»');
}
function save(){
 showSaveStatus('saving','● Guardando cambios…');
 try{
   const json=JSON.stringify(db);
   localStorage.setItem(KEY,json);
   if(localStorage.getItem(KEY)!==json)throw new Error('No se pudo verificar la escritura del almacenamiento local');
   lastSaveError='';pendingEdits=false;lastSavedAt=savedClock();
   showSaveStatus('saved','✓ Todos los cambios guardados · '+lastSavedAt);
   return true;
 }catch(err){
   lastSaveError=String(err.message||err);
   showSaveStatus('error','⚠ No se pudieron guardar los cambios');
   alert('No se pudieron guardar los datos. Exporta una copia JSON para protegerlos. Detalle: '+lastSaveError);
   return false;
 }
}
function hasPendingFields(){
 if(page!=='planning')return false;
 const e=sById(selectedSession);if(!e)return false;
 const fieldMap=[['editDate',e.date],['editHour',e.start],['editStatus',e.status],['editDuration',String(e.duration)],['sessionNotes',e.notes||'']];
 if(fieldMap.some(([id,val])=>$(id)&&$(id).value!==String(val)))return true;
 return [...document.querySelectorAll('[data-item-notes]')].some(inp=>{
   const item=e.items.find(i=>i.id===inp.dataset.itemNotes);
   return item && inp.value!==String(item.notes||'');
 });
}
function confirmLeavePending(){
 if(!pendingEdits&&!hasPendingFields())return true;
 return confirm('Hay cambios sin guardar en este ensayo. Si continúas, se perderán. ¿Descartar los cambios?');
}

function totals(){const s=season(),actual={};s.works.forEach(w=>actual[w.id]=0);let done=0;for(let sess of s.sessions){if(!isActive(sess))continue;done++;for(let it of sess.items)if(actual[it.workId]!==undefined) actual[it.workId]+=Math.max(0,Number(it.done)||0)}return {actual,done,planned:s.works.reduce((n,w)=>n+(Number(w.target)||0),0),performed:Object.values(actual).reduce((a,b)=>a+b,0)}}
function metrics(){const t=totals(),s=season();return [['Marchas',s.works.length],['Ensayos previstos',s.sessions.length],['Ensayos realizados',t.done],['Pases previstos',t.planned],['Pases realizados',t.performed],['Cumplimiento',(t.planned?t.performed/t.planned*100:0).toFixed(1)+' %']].map(([l,v])=>`<div class="card"><div class="small">${l}</div><div class="metric">${v}</div></div>`).join('')}
function progress(a,b){let p=b?a/b*100:0;let color=p>100?'#78b6f1':p>=90?'#72d9b3':p>=70?'#e7cf77':p>=40?'#e7a86a':'#e78d84';return `<div class="rowbar"><div style="width:${Math.min(100,p)}%;background:${color}"></div></div>`}
function button(txt,fun,kind=''){return `<button class="btn ${kind}" data-action="${fun}">${txt}</button>`}
function header(){return `<header><div><div class="tiny muted">AGRUPACIÓN MUSICAL SANTÍSIMO CRISTO DEL AMOR</div><h1>${({dashboard:'Panel de control',calendar:'Calendario de ensayos',planning:'Planificación y registro',works:'Repertorio musical',frequency:'Control de frecuencias',history:'Histórico de interpretaciones',reports:'Informes',settings:'Temporadas y copias de seguridad'})[page]}</h1></div><div class="fields"><div class="field"><label>Temporada</label><select id="seasonSwitch">${db.seasons.map(x=>`<option value="${safe(x.id)}" ${db.active===x.id?'selected':''}>${safe(x.name)}${x.archived?' (archivada)':''}</option>`).join('')}</select></div></div></header>${season().archived?'<div class="notice">Esta temporada está archivada. Se muestra en modo consulta para proteger el histórico.</div>':''}`}
function dashboard(){let t=totals(),s=season();let low=s.works.map(w=>({...w,real:t.actual[w.id]||0,pending:Math.max(0,w.target-(t.actual[w.id]||0))})).sort((a,b)=>b.pending-a.pending);return `<div class="stats">${metrics()}</div><div class="twocol"><section class="card"><h2>Progreso del repertorio</h2>${s.works.slice(0,14).map(w=>`<div style="display:grid;grid-template-columns:minmax(130px,1fr) 1fr 55px;gap:10px;align-items:center;margin:12px 0;font-size:12px"><span>${safe(w.title)}</span>${progress(t.actual[w.id]||0,w.target)}<span>${t.actual[w.id]||0}/${w.target}</span></div>`).join('')}<div class="footnote">La planificación no se contabiliza: solo se suman los pases registrados en ensayos marcados como Realizado.</div></section><section class="card"><h2>Marchas con más pases pendientes</h2>${low.slice(0,12).map(w=>`<div style="display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #34515b;padding:10px 0"><span>${safe(w.title)}</span><span class="pill">${w.pending} pendientes</span></div>`).join('')}</section></div><div class="actions">${button('Ir al próximo ensayo','next','primary')}${button('Exportar copia de seguridad','backup')}</div>`}
function calendar(){let s=season();let [y,m]=monthCursor.split('-').map(Number), first=(new Date(y,m-1,1).getDay()+6)%7, days=new Date(y,m,0).getDate();let cards=Array.from({length:first},()=>'<div class="day empty"></div>');for(let d=1;d<=days;d++){let ds=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`,items=s.sessions.filter(x=>x.date===ds);cards.push(`<div class="day"><strong>${d}</strong>${items.map(x=>`<button class="event ${x.status==='Cancelado'?'cancelled':x.status==='Realizado'?'done':''}" data-session="${safe(x.id)}">${safe(x.start)} · ${x.items.length} marchas</button>`).join('')}</div>`)}let ix=s.sessions.filter(x=>sessionShow==='all'||x.status===sessionShow).sort((a,b)=>a.date.localeCompare(b.date));return `<section class="card"><div class="actions" style="justify-content:space-between"><div class="actions">${button('‹ Mes anterior','prevMonth')}<strong>${new Date(y,m-1,1).toLocaleDateString('es-ES',{month:'long',year:'numeric'})}</strong>${button('Mes siguiente ›','nextMonth')}</div>${button('+ Añadir ensayo','newSession','primary')}</div><div class="cal" style="margin-top:15px">${['L','M','X','J','V','S','D'].map(x=>`<div class="calhead">${x}</div>`).join('')}${cards.join('')}</div></section><section class="card"><div class="actions" style="justify-content:space-between"><h2>Listado cronológico</h2><select id="sessionFilter"><option value="all">Todos</option>${['Previsto','Realizado','Cancelado','Suspendido'].map(z=>`<option ${sessionShow===z?'selected':''}>${z}</option>`).join('')}</select></div><div class="table-wrap"><table class="data"><thead><tr><th>Fecha</th><th>Hora</th><th>Estado</th><th>Marchas</th><th></th></tr></thead><tbody>${ix.map(x=>`<tr><td>${dateText(x.date)}</td><td>${safe(x.start)}</td><td><span class="tag">${safe(x.status)}</span></td><td>${x.items.length}</td><td><button class="btn smallbtn" data-session="${safe(x.id)}">Abrir</button></td></tr>`).join('')}</tbody></table></div></section>`}
function planning(){let s=season();let ses=sById(selectedSession)||s.sessions[0];if(!ses)return '<div class="empty-message">No existen ensayos. Créalo desde Calendario.</div>';selectedSession=ses.id;let locked=s.archived,readonly=locked?'disabled':'';return `<section class="card"><div class="fields"><div class="field grow"><label>Elegir ensayo</label><select id="sessionSelect">${[...s.sessions].sort((a,b)=>a.date.localeCompare(b.date)).map(x=>`<option value="${safe(x.id)}" ${x.id===ses.id?'selected':''}>${dateText(x.date)} · ${safe(x.status)}</option>`).join('')}</select></div><div class="field"><label>Fecha</label><input id="editDate" type="date" value="${safe(ses.date)}" ${readonly}></div><div class="field"><label>Hora</label><input id="editHour" type="time" value="${safe(ses.start)}" ${readonly}></div><div class="field"><label>Estado</label><select id="editStatus" ${readonly}>${['Previsto','Realizado','Cancelado','Suspendido'].map(z=>`<option ${z===ses.status?'selected':''}>${z}</option>`).join('')}</select></div><div class="field"><label>Duración (min)</label><input id="editDuration" type="number" min="1" value="${ses.duration}" ${readonly}></div></div><div class="fields" style="margin-top:10px"><div class="field grow"><label>Observaciones del ensayo</label><input id="sessionNotes" style="width:100%" value="${safe(ses.notes)}" ${readonly}></div>${button('Guardar datos del ensayo','saveSession','primary')}</div><p class="footnote">En los ensayos cancelados o suspendidos no se cuentan pases, aunque existan cantidades anotadas. Los datos de una temporada archivada no se pueden modificar.</p></section><section class="card"><div class="actions" style="justify-content:space-between"><h2>Programa del ensayo · ${ses.items.length} marchas</h2><div class="actions">${button('+ Añadir marcha','addItem')}${button('Informe imprimible','print')}</div></div><div class="table-wrap"><table class="data"><thead><tr><th>#</th><th>Marcha</th><th>Tipo</th><th>Previstas</th><th>Realizadas</th><th>Observaciones</th><th></th></tr></thead><tbody>${ses.items.map((it,i)=>{let w=wById(it.workId);return `<tr><td>${i+1}</td><td><strong>${safe(w?.title||'Obra eliminada')}</strong><br><small class="muted">Bloque ${w?.block||'?'}</small></td><td>${safe(it.type)}</td><td>${it.planned}</td><td><div class="session-count"><button class="btn smallbtn" data-minus="${safe(it.id)}" ${readonly}>−</button><span>${it.done||0}</span><button class="btn smallbtn" data-plus="${safe(it.id)}" ${readonly}>+</button></div></td><td><input style="min-width:130px;width:100%" data-item-notes="${safe(it.id)}" value="${safe(it.notes||'')}" ${readonly}></td><td><button class="btn smallbtn danger" data-remove-item="${safe(it.id)}" ${readonly}>×</button></td></tr>`}).join('')}</tbody></table></div><div class="actions" style="margin-top:16px">${button('Guardar observaciones','saveItemNotes','primary')}${button('Volver al calendario','goCalendar')}</div></section>`}
function worksView(){let t=totals(),s=season();let ws=s.works.filter(w=>(blockFilter==='all'||String(w.block)===blockFilter)&&w.title.toLocaleLowerCase('es').includes(search.toLocaleLowerCase('es'))).sort((a,b)=>sortMode==='deficit'?((b.target-t.actual[b.id])-(a.target-t.actual[a.id])):a.title.localeCompare(b.title,'es'));return `<section class="card"><div class="fields"><div class="field grow"><label>Buscar marcha</label><input id="workSearch" placeholder="Título de la marcha..." value="${safe(search)}"></div><div class="field"><label>Bloque</label><select id="blockFilter"><option value="all">Todos</option>${[1,2,3].map(n=>`<option value="${n}" ${blockFilter===String(n)?'selected':''}>Bloque ${n}</option>`).join('')}</select></div><div class="field"><label>Orden</label><select id="sortWorks"><option value="title">Alfabético</option><option value="deficit" ${sortMode==='deficit'?'selected':''}>Más pendientes</option></select></div>${button('+ Añadir marcha','newWork','primary')}</div></section><section class="card table-wrap"><table class="data"><thead><tr><th>Obra</th><th>Bloque</th><th>Objetivo</th><th>Realizadas</th><th>Pendientes</th><th>%</th><th>Progreso</th><th></th></tr></thead><tbody>${ws.map(w=>{let a=t.actual[w.id]||0;return `<tr><td><strong>${safe(w.title)}</strong></td><td>B${w.block}</td><td>${w.target}</td><td>${a}</td><td>${Math.max(0,w.target-a)}</td><td>${w.target?(100*a/w.target).toFixed(1):'0'}%</td><td>${progress(a,w.target)}</td><td><button class="btn smallbtn" data-edit-work="${safe(w.id)}">Editar</button></td></tr>`}).join('')}</tbody></table></section>`}
function frequency(){let s=season(),t=totals(),remaining=s.sessions.filter(x=>x.status==='Previsto').length;let ws=s.works.map(w=>{let act=t.actual[w.id]||0,missing=Math.max(0,w.target-act),due=remaining?Math.ceil(remaining/Math.max(1,missing)):0;return {...w,act,missing,due}}).sort((a,b)=>b.missing-a.missing);return `<div class="stats">${[1,2,3].map(b=>{let sub=ws.filter(x=>x.block===b),goal=sub.reduce((n,x)=>n+x.target,0),act=sub.reduce((n,x)=>n+x.act,0);return `<section class="card"><div class="small">Bloque ${b}</div><div class="metric">${act} / ${goal}</div>${progress(act,goal)}<div class="small" style="margin-top:9px">${goal?(100*act/goal).toFixed(1):0}% de cumplimiento</div></section>`}).join('')}</div><section class="card table-wrap"><h2>Prioridades y recomendaciones orientativas</h2><p class="muted tiny">La recomendación se calcula sobre los ensayos todavía previstos. No representa una obligación musical.</p><table class="data"><thead><tr><th>Marcha</th><th>Bloque</th><th>Hechas / objetivo</th><th>Pendientes</th><th>Ritmo aconsejado</th></tr></thead><tbody>${ws.map(w=>`<tr><td>${safe(w.title)}</td><td>B${w.block}</td><td>${w.act}/${w.target}</td><td>${w.missing}</td><td>${w.missing===0?'Objetivo alcanzado':remaining===0?'Sin ensayos futuros':w.missing>remaining?'Necesita más de 1 pase por ensayo':`1 pase cada ${w.due} ensayo(s)`}</td></tr>`).join('')}</tbody></table></section>`}
function history(){let s=season(),rows=[];for(let e of s.sessions)if(e.status==='Realizado')for(let it of e.items)if(it.done>0){let w=wById(it.workId);rows.push({date:e.date,title:w?.title||'Obra eliminada',block:w?.block,done:it.done,type:it.type,notes:it.notes})}rows.sort((a,b)=>b.date.localeCompare(a.date));return `<section class="card"><div class="actions" style="justify-content:space-between"><h2>${rows.length} registros positivos</h2>${button('Exportar histórico CSV','historyCSV')}</div><div class="table-wrap"><table class="data"><thead><tr><th>Fecha</th><th>Obra</th><th>Bloque</th><th>Pases</th><th>Trabajo</th><th>Observaciones</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${dateText(r.date)}</td><td>${safe(r.title)}</td><td>B${r.block}</td><td>${r.done}</td><td>${safe(r.type)}</td><td>${safe(r.notes)}</td></tr>`).join('')}</tbody></table></div>${rows.length?'':'<div class="empty-message">Todavía no hay interpretaciones contabilizadas.</div>'}</section>`}
function reports(){let t=totals(),s=season();return `<div class="stats">${metrics()}</div><section class="card"><h2>Informes disponibles</h2><p>Genera un informe imprimible desde el navegador o descarga listados compatibles con Excel. Los CSV utilizan punto y coma para facilitar su apertura en Windows con configuración española.</p><div class="actions">${button('Imprimir / Guardar como PDF','print','primary')}${button('Frecuencias CSV','frequencyCSV')}${button('Calendario CSV','calendarCSV')}${button('Histórico CSV','historyCSV')}</div></section><section class="card"><h2>Resumen por bloque</h2>${[1,2,3].map(b=>{let ws=s.works.filter(w=>w.block===b),goal=ws.reduce((n,w)=>n+w.target,0),act=ws.reduce((n,w)=>n+t.actual[w.id],0);return `<div style="display:flex;align-items:center;gap:15px;margin:14px 0"><strong style="width:80px">Bloque ${b}</strong><div style="flex:1">${progress(act,goal)}</div><span>${act}/${goal}</span></div>`}).join('')}</section>`}
function settings(){let s=season();return `<section class="card"><h2>Uso exclusivo en iPad</h2><p>Instala esta PWA desde Safari → Compartir → Añadir a pantalla de inicio. Una vez instalada y abierta al menos una vez con conexión, funciona sin Internet. Los datos quedan en este iPad y se exportan a tu PC mediante una copia JSON. <strong>Haz una copia semanal desde Configuración y guárdala en Archivos.</strong></p></section><section class="card"><h2>Temporadas</h2><div class="actions">${button('Crear temporada nueva','newSeason','primary')}${button(s.archived?'Desarchivar temporada':'Archivar temporada','archive')}</div><div class="table-wrap" style="margin-top:16px"><table class="data"><thead><tr><th>Temporada</th><th>Marchas</th><th>Ensayos</th><th>Estado</th></tr></thead><tbody>${db.seasons.map(x=>`<tr><td>${safe(x.name)}</td><td>${x.works.length}</td><td>${x.sessions.length}</td><td>${x.archived?'Archivada':'Abierta'}</td></tr>`).join('')}</tbody></table></div></section><section class="card"><h2>Protección y copias de seguridad</h2><p>Los datos se guardan automáticamente en el almacenamiento local de este iPad. No se sincronizan con el PC. <strong>No son un archivo de base de datos portable.</strong> Es imprescindible exportar copias JSON para poder recuperar los datos si se borran los datos de navegación, se cambia de ordenador o se usa otro navegador.</p><div class="actions">${button('Compartir copia JSON (iPad)','shareBackup','primary')}${button('Descargar copia JSON','backup')}${button('Importar copia JSON','restore')}${button('Exportar repertorio CSV','frequencyCSV')}</div><input style="display:none" type="file" id="restoreFile" accept=".json,application/json"><p class="footnote">La importación reemplaza el contenido actual después de una confirmación. Las temporadas archivadas se conservan en la copia.</p></section><section class="card"><h2>Comprobaciones del sistema</h2><div class="actions">${button('Ejecutar pruebas de frecuencias','runTests')}</div><div id="testReport" class="footnote"></div></section>`}
function render(){document.querySelectorAll('[data-nav]').forEach(x=>x.classList.toggle('active',x.dataset.nav===page));$('content').innerHTML=header()+({dashboard,calendar,planning,works:worksView,frequency,history,reports,settings}[page])();$('seasonSwitch').addEventListener('change',e=>{if(!confirmLeavePending()){e.target.value=db.active;return;}pendingEdits=false;db.active=e.target.value;selectedSession=null;save();render()});wire()}
function navigate(p){if(!confirmLeavePending())return;pendingEdits=false;page=p;render();window.scrollTo(0,0)}
function wire(){document.querySelectorAll('[data-session]').forEach(b=>b.onclick=()=>{selectedSession=b.dataset.session;navigate('planning')});document.querySelectorAll('[data-plus],[data-minus]').forEach(b=>b.onclick=()=>{if(season().archived||!confirmLeavePending())return;pendingEdits=false;let ses=sById(selectedSession),it=ses.items.find(x=>x.id===(b.dataset.plus||b.dataset.minus)),delta=b.hasAttribute('data-plus')?1:-1;it.done=Math.max(0,(Number(it.done)||0)+delta);save();render()});document.querySelectorAll('[data-remove-item]').forEach(b=>b.onclick=()=>{if(season().archived||!confirmLeavePending())return;pendingEdits=false;if(!confirm('¿Retirar esta marcha de la programación de este ensayo?'))return;let ses=sById(selectedSession);ses.items=ses.items.filter(x=>x.id!==b.dataset.removeItem);save();render()});document.querySelectorAll('[data-edit-work]').forEach(b=>b.onclick=()=>editWork(b.dataset.editWork));document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>act(b.dataset.action));if($('sessionSelect'))$('sessionSelect').onchange=e=>{if(!confirmLeavePending()){e.target.value=selectedSession;return;}pendingEdits=false;selectedSession=e.target.value;render()};if($('sessionFilter'))$('sessionFilter').onchange=e=>{sessionShow=e.target.value;render()};if($('blockFilter'))$('blockFilter').onchange=e=>{blockFilter=e.target.value;render()};if($('sortWorks'))$('sortWorks').onchange=e=>{sortMode=e.target.value;render()};if($('workSearch'))$('workSearch').oninput=e=>{search=e.target.value;let cur=e.target.selectionStart;render();$('workSearch').focus();$('workSearch').setSelectionRange(cur,cur)}}
function unique(prefix,objs){let n=1;while(objs.some(o=>o.id===prefix+n))n++;return prefix+n}
function act(a){let s=season();switch(a){case'next':{let x=s.sessions.find(x=>x.status==='Previsto')||s.sessions[0];if(x){selectedSession=x.id;navigate('planning')}else navigate('calendar');break}case'prevMonth':case'nextMonth':{let [y,m]=monthCursor.split('-').map(Number),d=new Date(y,m-1+(a==='nextMonth'?1:-1),1);monthCursor=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;render();break}case'newSession':{if(s.archived)return alert('Temporada archivada');let d=prompt('Fecha del nuevo ensayo (AAAA-MM-DD)',today());if(!d)return;if(!/^\d{4}-\d{2}-\d{2}$/.test(d)||Number.isNaN(new Date(d+'T12:00:00').getTime()))return alert('Fecha no válida');let e={id:unique('E',s.sessions),date:d,week:0,start:'20:30',duration:80,status:'Previsto',place:'',notes:'',items:[]};s.sessions.push(e);selectedSession=e.id;save();navigate('planning');break}case'saveSession':{if(s.archived)return alert('Temporada archivada');let e=sById(selectedSession);if(!$('editDate').value)return alert('Indica fecha');e.date=$('editDate').value;e.start=$('editHour').value;e.status=$('editStatus').value;e.duration=Math.max(1,Number($('editDuration').value)||80);e.notes=$('sessionNotes').value;document.querySelectorAll('[data-item-notes]').forEach(inp=>{let it=e.items.find(i=>i.id===inp.dataset.itemNotes);if(it)it.notes=inp.value});save();render();break}case'addItem':{if(s.archived)return alert('Temporada archivada');let q=prompt('Escribe parte del título de la marcha para buscarla:');if(!q)return;let matches=s.works.filter(w=>w.title.toLowerCase().includes(q.trim().toLowerCase()));if(!matches.length)return alert('No se encontró la marcha en el repertorio');let w=matches.length===1?matches[0]:null;if(!w){let num=prompt(matches.slice(0,20).map((x,i)=>`${i+1}. ${x.title}`).join('\n')+'\n\nNúmero de la marcha:');w=matches[Number(num)-1]}if(!w)return;let e=sById(selectedSession);e.items.push({id:unique('R',e.items),workId:w.id,type:'Repaso B'+w.block,planned:1,done:0,notes:''});save();render();break}case'saveItemNotes':{if(s.archived)return alert('Temporada archivada');act('saveSession');break}case'goCalendar':navigate('calendar');break;case'newWork':editWork(null);break;case'backup':download('Copia_Music_Rehearsal_Manager_'+today()+'.json',JSON.stringify(db,null,2),'application/json');break;case'shareBackup':shareBackup();break;case'restore':$('restoreFile').click();break;case'frequencyCSV':exportCSV('Frecuencias', [['Temporada','Obra','Bloque','Objetivo','Realizadas','Pendientes','Porcentaje'],...s.works.map(w=>{let t=totals(),a=t.actual[w.id]||0;return[s.id,w.title,w.block,w.target,a,Math.max(0,w.target-a),w.target?(100*a/w.target).toFixed(1):0]})]);break;case'calendarCSV':exportCSV('Calendario', [['Temporada','Fecha','Hora','Estado','Obras','Observaciones'],...s.sessions.map(x=>[s.id,x.date,x.start,x.status,x.items.length,x.notes])]);break;case'historyCSV':{let rows=[];s.sessions.filter(x=>x.status==='Realizado').forEach(e=>e.items.forEach(it=>{if(it.done>0){let w=wById(it.workId);rows.push([s.id,e.date,w?.title||'',w?.block||'',it.done,it.type,it.notes])}}));exportCSV('Historico',[['Temporada','Fecha','Obra','Bloque','Pases','Trabajo','Observaciones'],...rows]);break}case'print':window.print();break;case'archive':{if(!confirm(s.archived?'¿Desarchivar esta temporada?':'¿Archivar esta temporada? Ya no se podrá editar hasta desarchivarla.'))return;s.archived=!s.archived;save();render();break}case'newSeason':{let name=prompt('Nombre de la nueva temporada, por ejemplo 2027-2028:');if(!name)return;name=name.trim();if(db.seasons.some(x=>x.id===name))return alert('Ya existe una temporada con ese nombre');if(!/^\d{4}-\d{4}$/.test(name))return alert('Usa formato AAAA-AAAA');let works=s.works.map(w=>({...w,id:w.id,target:w.block===1?12:w.block===2?7:4}));db.seasons.push({id:name,name,start:name.slice(0,4)+'-11-01',end:name.slice(5)+'-03-31',archived:false,works,sessions:[]});db.active=name;save();navigate('dashboard');break}case'runTests':{let results=[];[5,6,10,11].forEach((n,i)=>results.push(`${n} de 10 = ${n*10}% ${[50,60,100,110][i]===n*10?'✓':'✗'}`));let tmp={status:'Cancelado',items:[{done:3}]};results.push('Ensayo cancelado = '+(tmp.status==='Realizado'?tmp.items[0].done:0)+' ✓');results.push('Tres pases en un ensayo = '+[1,1,1].reduce((a,b)=>a+b,0)+' ✓');$('testReport').textContent=results.join(' · ');break}}}
function editWork(id){let s=season();if(s.archived)return alert('Temporada archivada');let w=id?wById(id):null;let title=prompt('Título de la marcha:',w?.title||'');if(title===null)return;title=title.trim();if(!title)return alert('El título es obligatorio');if(s.works.some(x=>x.title.toLowerCase()===title.toLowerCase()&&x.id!==id))return alert('Ya hay una marcha con ese nombre');let blk=prompt('Bloque de dificultad (1, 2 o 3):',w?.block||1);if(blk===null)return;let block=Number(blk);if(![1,2,3].includes(block))return alert('Bloque no válido');let tg=prompt('Número de pases objetivo:',w?.target??(block===1?12:block===2?7:4));if(tg===null)return;let target=Number(tg);if(!Number.isInteger(target)||target<1)return alert('Debe ser un entero positivo');if(w){Object.assign(w,{title,block,target})}else{s.works.push({id:unique('W',s.works),title,block,target,notes:'',composer:''})}save();render()}
function download(name,body,mime){const b=new Blob([body],{type:mime}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function exportCSV(name,rows){let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');download(name+'_'+season().id+'.csv',csv,'text/csv;charset=utf-8')}
function validate(x){if(!x||!Array.isArray(x.seasons)||!x.seasons.length||typeof x.active!=='string'||x.seasons.some(s=>!Array.isArray(s.works)||!Array.isArray(s.sessions)||typeof s.id!=='string'||s.sessions.some(e=>!Array.isArray(e.items))))throw Error('El archivo no tiene la estructura de una copia válida.');if(!x.seasons.some(s=>s.id===x.active))throw Error('No existe la temporada activa.');return x}

async function shareBackup(){
  if(pendingEdits||hasPendingFields())return alert('Antes de exportar, guarda las observaciones y el estado del ensayo.');
  const name='Copia_Music_Rehearsal_Manager_'+today()+'.json';
  const file=new File([JSON.stringify(db,null,2)],name,{type:'application/json'});
  if(navigator.canShare && navigator.canShare({files:[file]}) && navigator.share){
    try{await navigator.share({files:[file],title:'Copia de seguridad de ensayos'});return;}
    catch(e){if(e.name==='AbortError')return;}
  }
  download(name,JSON.stringify(db,null,2),'application/json');
  alert('Copia JSON creada. En el iPad guárdala en Archivos, preferiblemente iCloud Drive o En mi iPad.');
}
if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(err=>console.warn('Modo offline no activado:',err)));
}

document.addEventListener('change',async e=>{if(e.target?.id!=='restoreFile')return;let f=e.target.files[0];if(!f)return;try{let x=validate(JSON.parse(await f.text()));if(!confirm('La importación reemplazará TODAS las temporadas y datos actuales. ¿Continuar?'))return;db=x;selectedSession=null;save();navigate('dashboard');alert('Copia importada correctamente')}catch(err){alert('No se ha podido importar: '+err.message)}finally{e.target.value=''}});

document.addEventListener('input',e=>{
 if(e.target && (['editDate','editHour','editDuration','sessionNotes'].includes(e.target.id)||e.target.hasAttribute('data-item-notes'))){
   if(hasPendingFields())markPending();else if(pendingEdits){pendingEdits=false;showSaveStatus('saved','✓ Todos los cambios guardados · '+(lastSavedAt||'sesión actual'));}
 }
});
document.addEventListener('change',e=>{
 if(e.target && e.target.id==='editStatus'){
   if(hasPendingFields())markPending();else if(pendingEdits){pendingEdits=false;showSaveStatus('saved','✓ Todos los cambios guardados · '+(lastSavedAt||'sesión actual'));}
 }
});
window.addEventListener('beforeunload',e=>{
 if(pendingEdits||hasPendingFields()){e.preventDefault();e.returnValue='';}
});

document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>navigate(b.dataset.nav));
save();render();
</script></body></html>
